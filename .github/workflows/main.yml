# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: talent-CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: prod

    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    env:
      HOSTNAME: ${{ secrets.HOSTNAME }}
      PORT: ${{ secrets.PORT }}
      HOST: ${{secrets.HOST}}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      NEXT_PUBLIC_SANITY_USERID: ${{ secrets.NEXT_PUBLIC_SANITY_USERID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{secrets.NEXT_PUBLIC_SANITY_API_VERSION}}
      NEXT_PUBLIC_SANITY_USE_CDN: ${{ secrets.NEXT_PUBLIC_SANITY_USE_CDN }}
      NEXT_PUBLIC_CAREERS_ADMIN_EMAIL_ID: ${{ secrets.NEXT_PUBLIC_CAREERS_ADMIN_EMAIL_ID }}
      NEXT_PUBLIC_CAREERS_ADMIN_TEMPLETE_ID: ${{ secrets.NEXT_PUBLIC_CAREERS_ADMIN_TEMPLETE_ID }}
      NEXT_PUBLIC_DEMO_ADMIN_EMAIL_ID: ${{ secrets.NEXT_PUBLIC_DEMO_ADMIN_EMAIL_ID }}
      NEXT_PUBLIC_DEMO_ADMIN_TEMPLETE_ID: ${{ secrets.NEXT_PUBLIC_DEMO_ADMIN_TEMPLETE_ID }}
      NEXT_PUBLIC_PARTNERS_ADMIN_EMAIL_ID: ${{secrets.NEXT_PUBLIC_PARTNERS_ADMIN_EMAIL_ID}}
      NEXT_PUBLIC_PARTNERS_ADMIN_TEMPLETE_ID: ${{ secrets.NEXT_PUBLIC_PARTNERS_ADMIN_TEMPLETE_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_END_POINT: ${{ secrets.NEXT_PUBLIC_END_POINT }}
      NEXT_PUBLIC_REGION: ${{ secrets.NEXT_PUBLIC_REGION }}
      NEXT_PUBLIC_B2_APPLICATION_KEY_ID: ${{ secrets.NEXT_PUBLIC_B2_APPLICATION_KEY_ID }}
      NEXT_PUBLIC_B2_APPLICATION_KEY: ${{ secrets.NEXT_PUBLIC_B2_APPLICATION_KEY }}
      NEXT_PUBLIC_BUCKET_NAME: ${{ secrets.NEXT_PUBLIC_BUCKET_NAME }}      
      
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - uses: actions/cache@v3
      with:
        # See here for caching with `yarn` https://github.com/actions/cache/blob/main/examples.md#node---yarn or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
        path: |
          ~/.npm
          ${{ github.workspace }}/.next/cache
        # Generate a new cache whenever packages or source files change.
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        # If source files changed but packages didn't, rebuild from a prior cache.
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
    - run: |
        npm ci --legacy-peer-deps
        npm run build
        pm2 restart talent-main
